<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 668" role="img" aria-labelledby="title desc">
  <title id="title">두 요청이 Redis에서 만나 새 방 B를 유지하는 흐름</title>
  <desc id="desc">새 세션 B가 현재 방을 B로 바꾼 뒤, 지연된 이전 세션 A의 삭제 요청이 도착합니다. Redis Lua에서 현재 방 B와 정리 대상 A가 다름을 확인하고 삭제를 건너뜁니다.</desc>
  <defs>
    <marker id="pink-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#e33485" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#76818b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
      .label{font-size:16px;font-weight:800;fill:#d7357d}
      .muted-label{fill:#65707b}
      .heading{font-size:21px;font-weight:900;fill:#1e252b}
      .body{font-size:15px;fill:#6b7680}
      .small{font-size:13px;fill:#7a858f}
      .code{font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;font-weight:700;fill:#242b32}
      .code-small{font-family:"SFMono-Regular",Consolas,monospace;font-size:14px;fill:#e7edf3}
    </style>
  </defs>

  <text class="label" x="18" y="35">t0 · 새 세션 (B)</text>
  <text class="label muted-label" x="594" y="35" text-anchor="end">t1 · 이전 세션 (A, 지연 도착)</text>
  <path d="M26 69 V227" fill="none" stroke="#f08cbb" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M594 69 V227" fill="none" stroke="#aab2b9" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="26" cy="70" r="6" fill="#e33485"/>
  <circle cx="26" cy="198" r="5" fill="#e33485"/>
  <circle cx="594" cy="70" r="6" fill="#76818b"/>
  <circle cx="594" cy="198" r="5" fill="#76818b"/>

  <text class="heading" x="50" y="82">새 방 B 배정</text>
  <text class="body" x="50" y="111">사용자가 새 방 B에 배정됩니다.</text>
  <rect x="69" y="148" width="194" height="42" rx="5" fill="#fbeef4" stroke="#f3c8dc"/>
  <text class="code" x="87" y="175">SET currentRoom B</text>
  <text class="small" x="50" y="284">사용자 활동 · 현재 세션</text>

  <text class="heading" x="570" y="82" text-anchor="end">이전 방 A 정리</text>
  <text class="body" x="570" y="111" text-anchor="end">지연된 이전 세션의</text>
  <text class="body" x="570" y="132" text-anchor="end">정리 요청이 도착합니다.</text>
  <rect x="357" y="148" width="211" height="42" rx="5" fill="#f1f2f3" stroke="#e0e2e4"/>
  <text class="code" x="373" y="175">cleanup(roomId: A)</text>
  <text class="small" x="570" y="284" text-anchor="end">네트워크 지연 · 늦은 요청</text>

  <path d="M26 198 C26 252 135 245 208 255 C258 262 278 284 294 301" fill="none" stroke="#e33485" stroke-width="2.3" stroke-linecap="round" marker-end="url(#pink-arrow)"/>
  <path d="M594 198 C594 252 485 245 412 255 C362 262 342 284 326 301" fill="none" stroke="#76818b" stroke-width="2.3" stroke-linecap="round" marker-end="url(#gray-arrow)"/>

  <g transform="translate(286 307) scale(.38)">
    <path fill="#A41E11" d="M121.8 93.1c-6.7 3.5-41.4 17.7-48.8 21.6-7.4 3.9-11.5 3.8-17.3 1S13 98.1 6.3 94.9c-3.3-1.6-5-2.9-5-4.2V78s48-10.5 55.8-13.2c7.8-2.8 10.4-2.9 17-.5s46.1 9.5 52.6 11.9v12.5c0 1.3-1.5 2.7-4.9 4.4z"/>
    <path fill="#D82C20" d="M121.8 80.5C115.1 84 80.4 98.2 73 102.1c-7.4 3.9-11.5 3.8-17.3 1-5.8-2.8-42.7-17.7-49.4-20.9C-.3 79-.5 76.8 6 74.3c6.5-2.6 43.2-17 51-19.7 7.8-2.8 10.4-2.9 17-.5s41.1 16.1 47.6 18.5c6.7 2.4 6.9 4.4.2 7.9z"/>
    <path fill="#A41E11" d="M121.8 72.5C115.1 76 80.4 90.2 73 94.1c-7.4 3.8-11.5 3.8-17.3 1C49.9 92.3 13 77.4 6.3 74.2c-3.3-1.6-5-2.9-5-4.2V57.3s48-10.5 55.8-13.2c7.8-2.8 10.4-2.9 17-.5s46.1 9.5 52.6 11.9V68c0 1.3-1.5 2.7-4.9 4.5z"/>
    <path fill="#D82C20" d="M121.8 59.8c-6.7 3.5-41.4 17.7-48.8 21.6-7.4 3.8-11.5 3.8-17.3 1C49.9 79.6 13 64.7 6.3 61.5s-6.8-5.4-.3-7.9c6.5-2.6 43.2-17 51-19.7 7.8-2.8 10.4-2.9 17-.5s41.1 16.1 47.6 18.5c6.7 2.4 6.9 4.4.2 7.9z"/>
    <path fill="#A41E11" d="M121.8 51c-6.7 3.5-41.4 17.7-48.8 21.6-7.4 3.8-11.5 3.8-17.3 1C49.9 70.9 13 56 6.3 52.8c-3.3-1.6-5.1-2.9-5.1-4.2V35.9s48-10.5 55.8-13.2c7.8-2.8 10.4-2.9 17-.5s46.1 9.5 52.6 11.9v12.5c.1 1.3-1.4 2.6-4.8 4.4z"/>
    <path fill="#D82C20" d="M121.8 38.3C115.1 41.8 80.4 56 73 59.9c-7.4 3.8-11.5 3.8-17.3 1S13 43.3 6.3 40.1s-6.8-5.4-.3-7.9c6.5-2.6 43.2-17 51-19.7 7.8-2.8 10.4-2.9 17-.5s41.1 16.1 47.6 18.5c6.7 2.4 6.9 4.4.2 7.8z"/>
    <path fill="#fff" d="M80.4 26.1l-10.8 1.2-2.5 5.8-3.9-6.5-12.5-1.1 9.3-3.4-2.8-5.2 8.8 3.4 8.2-2.7L72 23zM66.5 54.5l-20.3-8.4 29.1-4.4z"/>
    <ellipse fill="#fff" cx="38.4" cy="35.4" rx="15.5" ry="6"/>
    <path fill="#7A0C00" d="M93.3 27.7l17.2 6.8-17.2 6.8z"/>
    <path fill="#AD2115" d="M74.3 35.3l19-7.6v13.6l-1.9.8z"/>
  </g>

  <text x="310" y="377" text-anchor="middle" class="label" style="font-size:14px;letter-spacing:1px">REDIS · LUA GUARD</text>
  <text x="310" y="406" text-anchor="middle" class="heading" style="font-size:25px">현재 방 B <tspan fill="#d7357d">≠</tspan> 정리 대상 A</text>
  <text x="310" y="433" text-anchor="middle" class="body">현재 저장된 방과 삭제 대상이 다르므로</text>
  <text x="310" y="453" text-anchor="middle" class="body">삭제하지 않습니다.</text>
  <rect x="138" y="463" width="344" height="95" rx="6" fill="#1d222a"/>
  <text class="code-small" x="154" y="483" xml:space="preserve"><tspan fill="#ff75b3">local</tspan> room = redis.call(<tspan fill="#d8e77b">'GET'</tspan>, key)</text>
  <text class="code-small" x="154" y="501" xml:space="preserve"><tspan fill="#ff75b3">if</tspan> room == ARGV[1] <tspan fill="#ff75b3">then</tspan></text>
  <text class="code-small" x="166" y="519" xml:space="preserve"><tspan fill="#ff75b3">return</tspan> redis.call(<tspan fill="#d8e77b">'DEL'</tspan>, key)</text>
  <text class="code-small" x="154" y="537"><tspan fill="#ff75b3">end</tspan></text>
  <text class="code-small" x="154" y="552" xml:space="preserve"><tspan fill="#ff75b3">return</tspan> 0  <tspan fill="#9da6b1">-- B 유지</tspan></text>
  <path d="M310 560 V584" fill="none" stroke="#e33485" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#pink-arrow)"/>
  <circle cx="310" cy="600" r="11" fill="#fff" stroke="#f3b9d5" stroke-width="3"/>
  <circle cx="310" cy="600" r="5.5" fill="#e33485"/>
  <text x="310" y="633" text-anchor="middle" class="label" style="font-size:22px">B 유지</text>
  <text x="310" y="657" text-anchor="middle" class="body">현재 방 B가 그대로 안전하게 유지됩니다.</text>
</svg>
