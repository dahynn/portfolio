<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">SAN 비동기 감사 흐름</title>
  <desc id="desc">Request Snapshot에서 Queue로, Queue에서 Worker Restore로, 실행 결과는 Audit Log로 이어집니다. 워커는 finally에서 이전 Context를 복원합니다.</desc>
  <defs>
    <linearGradient id="icon-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#95bcb0"/><stop offset="1" stop-color="#4f9482"/></linearGradient>
    <linearGradient id="icon-pale" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcebe4"/><stop offset="1" stop-color="#b9d7ca"/></linearGradient>
    <marker id="flow-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#5b9c88"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#5b9c88"/></marker>
    <marker id="restore-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#5b9c88"/></marker>
    <marker id="restore-arrow-pale" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#bdd9cd"/></marker>
    <style>text{font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}.number{font-family:Georgia,"Times New Roman",serif;font-size:31px;fill:#72a695}.name{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:700;fill:#193329}.description{font-size:20px;font-weight:550;fill:#536b60}.line{fill:none;stroke:#5b9c88;stroke-width:2.6;stroke-linecap:round}.flow{marker-end:url(#flow-arrow)}.trace{fill:none;stroke:#b6e3d1;stroke-width:5;stroke-linecap:round;pathLength:100;stroke-dasharray:0 100;opacity:0;animation:san-flow-draw 5.6s ease-in-out infinite}.trace-2{animation-delay:.85s}.trace-3{animation-delay:1.7s}.trace-finally{animation-delay:2.55s;stroke-width:4}@keyframes san-flow-draw{0%,2%{stroke-dasharray:0 100;opacity:0}4%{opacity:1}18%{stroke-dasharray:100 0;opacity:1}22%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none;opacity:0}}</style>
  </defs>
  <g aria-label="Request Snapshot">
    <text class="number" x="190" y="62" text-anchor="middle">01</text>
    <path d="M146 112h68l28 28v82c0 8-6 14-14 14h-82c-8 0-14-6-14-14v-96c0-8 6-14 14-14Z" fill="none" stroke="url(#icon-pale)" stroke-width="9" stroke-linejoin="round"/>
    <path d="M214 112v28h28" fill="url(#icon-ink)" stroke="#5b9c88" stroke-width="3" stroke-linejoin="round"/>
    <path d="M157 158h38M157 181h61M157 204h61" fill="none" stroke="#8bb8a8" stroke-width="6" stroke-linecap="round"/>
    <text class="name" x="190" y="309" text-anchor="middle">Request Snapshot</text>
    <text class="description" x="190" y="351" text-anchor="middle">요청 시점의 맥락을 고정하고</text>
    <text class="description" x="190" y="380" text-anchor="middle">작업과 함께 전달합니다.</text>
  </g>
  <path class="line flow" d="M261 174H517"/>
  <path class="trace" pathLength="100" d="M261 174H517"/>
  <g aria-label="Queue">
    <text class="number" x="590" y="62" text-anchor="middle">02</text>
    <path d="m590 110 58 28-58 28-58-28Z" fill="url(#icon-pale)"/>
    <path d="m532 158 58 29 58-29" fill="none" stroke="#a2c8b9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m532 187 58 29 58-29" fill="none" stroke="#5b9c88" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="name" x="590" y="309" text-anchor="middle">Queue</text>
    <text class="description" x="590" y="351" text-anchor="middle">작업과 스냅샷을 큐에 등록해</text>
    <text class="description" x="590" y="380" text-anchor="middle">워커로 전달합니다.</text>
  </g>
  <path class="line flow" d="M669 174H929"/>
  <path class="trace trace-2" pathLength="100" d="M669 174H929"/>
  <g aria-label="Worker Restore">
    <text class="number" x="990" y="62" text-anchor="middle">03</text>
    <path d="M943 172a48 48 0 0 1 81-34" fill="none" stroke="url(#icon-ink)" stroke-width="9" stroke-linecap="round" marker-end="url(#restore-arrow)"/>
    <path d="M1037 175a48 48 0 0 1-81 35" fill="none" stroke="url(#icon-pale)" stroke-width="9" stroke-linecap="round" marker-end="url(#restore-arrow-pale)"/>
    <text class="name" x="990" y="309" text-anchor="middle">Worker Restore</text>
    <text class="description" x="990" y="351" text-anchor="middle">요청 스냅샷을 복원해</text>
    <text class="description" x="990" y="380" text-anchor="middle">격리된 Context에서 실행합니다.</text>
    <path d="M900 405v30q0 20 20 20h140q20 0 20-20v-30" fill="none" stroke="#5b9c88" stroke-width="2.4" marker-end="url(#return-arrow)"/>
    <path class="trace trace-finally" pathLength="100" d="M900 405v30q0 20 20 20h140q20 0 20-20v-30"/>
    <text x="990" y="492" text-anchor="middle" font-size="19" font-weight="650" fill="#466c5b">finally · 이전 Context 복원</text>
  </g>
  <path class="line flow" d="M1056 174H1328"/>
  <path class="trace trace-3" pathLength="100" d="M1056 174H1328"/>
  <g aria-label="Audit Log">
    <text class="number" x="1400" y="62" text-anchor="middle">04</text>
    <circle cx="1351" cy="144" r="11" fill="#5b9c88"/>
    <circle cx="1351" cy="177" r="11" fill="#b0d2c3"/>
    <circle cx="1351" cy="210" r="11" fill="#d4e7dc"/>
    <path d="M1381 144h79M1381 177h79M1381 210h79" stroke="url(#icon-ink)" stroke-width="8" stroke-linecap="round"/>
    <text class="name" x="1400" y="309" text-anchor="middle">Audit Log</text>
    <text class="description" x="1400" y="351" text-anchor="middle">START · SUCCESS · FAILURE를</text>
    <text class="description" x="1400" y="380" text-anchor="middle">같은 traceId로 기록합니다.</text>
  </g>
</svg>
