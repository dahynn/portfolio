<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">같은 주문의 결제 승인 이후 내부 복구 흐름</title>
  <desc id="desc">PG 승인 완료 후 내부 저장이 실패해도 재승인하지 않고 기존 거래를 조회하여 계약과 이벤트를 복구하는 과정</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#116eaa"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8d98a3"/>
    </marker>
    <style>
      text{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#182330}
      .lane{fill:#f3f6f8;stroke:#d9e0e5;stroke-width:1.5}
      .node{fill:#fff;stroke:#b9c8d2;stroke-width:1.5}
      .node-blue{fill:#f2f9fd;stroke:#78b8d9;stroke-width:1.5}
      .node-warn{fill:#fff5f3;stroke:#df8079;stroke-width:1.5}
      .guide{stroke:#d8dfe4;stroke-width:1.3;stroke-dasharray:5 6}
      .flow{fill:none;stroke:#116eaa;stroke-width:1.8;marker-end:url(#arrow)}
      .flow-muted{fill:none;stroke:#8d98a3;stroke-width:1.7;stroke-dasharray:5 5;marker-end:url(#arrow-muted)}
      .label{font-size:17px;font-weight:800}
      .sub{font-size:14px;fill:#52616d}
      .step{font-size:14px;font-weight:900;fill:#116eaa}
      .title{font-size:16px;font-weight:800}
      .status{font-size:13px;font-weight:800;fill:#116eaa}
      .warning{fill:#bf3832}
    </style>
  </defs>

  <rect x="4" y="4" width="992" height="472" rx="18" fill="#ffffff" stroke="#dce3e7"/>
  <text x="30" y="36" class="label">결제 처리 및 복구 흐름 · 동일 주문</text>
  <text x="970" y="36" class="sub" text-anchor="end">승인은 한 번, 내부 처리는 끝까지</text>

  <rect x="138" y="54" width="190" height="78" rx="10" class="lane"/>
  <rect x="344" y="54" width="190" height="78" rx="10" class="lane"/>
  <rect x="550" y="54" width="190" height="78" rx="10" class="lane"/>
  <rect x="756" y="54" width="214" height="78" rx="10" class="lane"/>
  <g fill="none" stroke="#116eaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="223" y="62" width="20" height="13" rx="2"/><path d="M223 67h20M238 72h2"/>
    <rect x="429" y="61" width="20" height="6" rx="2"/><rect x="429" y="70" width="20" height="6" rx="2"/><path d="M433 64h.1M433 73h.1"/>
    <ellipse cx="645" cy="64" rx="10" ry="4"/><path d="M635 64v10c0 2 4.5 4 10 4s10-2 10-4V64M635 69c0 2 4.5 4 10 4s10-2 10-4"/>
    <path d="M852 61h14l6 6v12h-20zM866 61v6h6M856 72h12M856 76h9"/>
  </g>
  <text x="233" y="101" text-anchor="middle" class="label">PG</text>
  <text x="233" y="122" text-anchor="middle" class="sub">(외부 결제사)</text>
  <text x="439" y="101" text-anchor="middle" class="label">Backend</text>
  <text x="439" y="122" text-anchor="middle" class="sub">(주문 · 결제)</text>
  <text x="645" y="101" text-anchor="middle" class="label">DB</text>
  <text x="645" y="122" text-anchor="middle" class="sub">(내부 저장소)</text>
  <text x="863" y="101" text-anchor="middle" class="label">Contract &amp; Outbox</text>
  <text x="863" y="122" text-anchor="middle" class="sub">(계약 · 증권 · 이벤트)</text>

  <line x1="336" y1="54" x2="336" y2="456" class="guide"/>
  <line x1="542" y1="54" x2="542" y2="456" class="guide"/>
  <line x1="748" y1="54" x2="748" y2="456" class="guide"/>

  <text x="30" y="184" class="step">01</text>
  <text x="62" y="184" class="title">정상 승인</text>
  <text x="62" y="207" class="sub">(외부 결제)</text>
  <rect x="156" y="146" width="154" height="88" rx="10" class="node-blue"/>
  <text x="233" y="182" text-anchor="middle" class="title">결제 승인 완료</text>
  <text x="233" y="207" text-anchor="middle" class="sub">PG 승인 · 1회</text>
  <path d="M310 190 H360" class="flow"/>
  <rect x="360" y="146" width="158" height="88" rx="10" class="node"/>
  <text x="439" y="182" text-anchor="middle" class="title">승인 결과 수신</text>
  <text x="439" y="207" text-anchor="middle" class="sub">주문 APPROVING</text>
  <path d="M518 190 H566" class="flow"/>
  <rect x="566" y="146" width="158" height="88" rx="10" class="node-warn"/>
  <circle cx="590" cy="180" r="9" fill="#d94b45"/>
  <path d="M587 177l6 6M593 177l-6 6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="660" y="180" text-anchor="middle" class="title warning">내부 저장 실패</text>
  <text x="645" y="207" text-anchor="middle" class="sub">HTTP 500 · 증권 0건</text>
  <path d="M724 190 H772" class="flow-muted"/>
  <rect x="772" y="146" width="182" height="88" rx="10" class="node"/>
  <text x="863" y="180" text-anchor="middle" class="title">후속 처리 미반영</text>
  <text x="863" y="207" text-anchor="middle" class="sub">증권 · 이벤트 미생성</text>

  <text x="30" y="304" class="step">02</text>
  <text x="62" y="304" class="title">조회 후 복구</text>
  <text x="62" y="327" class="sub">(중복 승인 방지)</text>
  <path d="M645 234 V298 H518" class="flow-muted"/>
  <rect x="360" y="254" width="158" height="88" rx="10" class="node-blue"/>
  <text x="439" y="290" text-anchor="middle" class="title">기존 거래 조회</text>
  <text x="439" y="315" text-anchor="middle" class="sub">기존 결제 키로 조회</text>
  <path d="M360 298 H310" class="flow"/>
  <rect x="156" y="254" width="154" height="88" rx="10" class="node"/>
  <text x="233" y="290" text-anchor="middle" class="title">기존 승인 확인</text>
  <text x="233" y="315" text-anchor="middle" class="sub">재승인 없음</text>
  <path d="M310 324 H360" class="flow"/>
  <path d="M439 342 V370" class="flow"/>

  <text x="30" y="416" class="step">03</text>
  <text x="62" y="416" class="title">복구 완료</text>
  <text x="62" y="439" class="sub">(계약 · 이벤트)</text>
  <rect x="360" y="370" width="158" height="84" rx="10" class="node"/>
  <text x="439" y="404" text-anchor="middle" class="title">주문 재처리</text>
  <text x="439" y="429" text-anchor="middle" class="sub">내부 처리 재개</text>
  <path d="M518 412 H566" class="flow"/>
  <rect x="566" y="370" width="158" height="84" rx="10" class="node-blue"/>
  <text x="645" y="404" text-anchor="middle" class="title">PAID / ACTIVE</text>
  <text x="645" y="429" text-anchor="middle" class="status">(증권 1건 생성)</text>
  <path d="M724 412 H772" class="flow"/>
  <rect x="772" y="370" width="182" height="84" rx="10" class="node-blue"/>
  <text x="863" y="404" text-anchor="middle" class="title">계약 활성화</text>
  <text x="863" y="429" text-anchor="middle" class="status">Outbox 이벤트 1건</text>
</svg>
