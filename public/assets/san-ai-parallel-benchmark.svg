<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">카드 요약 순차 처리와 동시 처리 비교</title>
  <desc id="desc">같은 카드 3개를 순차 또는 병렬로 처리한 10쌍의 비교 실험입니다. 카드 요약 단계의 실행당 전체 소요 시간은 순차 평균 17.68초, 병렬 평균 6.92초입니다. 카드별 소요 시간은 이 평균값에서 추정하지 않습니다.</desc>
  <defs>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#8aa89a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#4f9482" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>text{font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.eyebrow{font-size:14px;font-weight:700;letter-spacing:.4px;fill:#809a8c}.section{font-family:Arial,sans-serif;font-size:20px;font-weight:800;letter-spacing:1px;fill:#244b3b}.sub{font-size:14px;font-weight:600;fill:#6d8376}.card-label{font-family:Arial,sans-serif;font-size:20px;font-weight:700;letter-spacing:1px;fill:#315746}.result-label{font-size:14px;font-weight:700;fill:#5e796b}.result-time{font-size:38px;font-weight:900;fill:#1b3027}.green{fill:#397e68}.trace{fill:none;stroke:#b6e3d1;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:0 100;opacity:0;animation:san-benchmark-draw 5.8s ease-in-out infinite}.trace-seq-2{animation-delay:.55s}.trace-seq-3{animation-delay:1.1s}.trace-fan{animation-delay:.25s}.trace-join{animation-delay:1.65s}@keyframes san-benchmark-draw{0%,2%{stroke-dasharray:0 100;opacity:0}4%{opacity:1}20%{stroke-dasharray:100 0;opacity:1}24%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none;opacity:0}}</style>
  </defs>

  <text x="28" y="36" class="eyebrow">동일 입력으로 카드 3건 요약</text>

  <text x="28" y="121" class="section">BEFORE</text>
  <text x="28" y="146" class="sub">순차 처리</text>
